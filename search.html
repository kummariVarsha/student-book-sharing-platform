<!DOCTYPE html>
<html>
<head>
  <title>Search Books</title>

  <style>
    body{
      font-family:Arial;
      background:#f2f2f2;
      text-align:center;
    }

    .box{
      width:350px;
      background:white;
      margin:100px auto;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px gray;
    }

    input{
      width:90%;
      padding:10px;
      margin:10px;
    }

    button{
      padding:10px 20px;
      background:blue;
      color:white;
      border:none;
      border-radius:5px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Search Books</h2>

  <input type="text" placeholder="Search Book"><br>

  <button>Search</button>
</div>

</body>
</html>
